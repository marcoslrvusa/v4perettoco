<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V4 Agents - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e4e4e7;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%);
      top: -200px;
      right: -200px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(168,85,247,0.06) 0%, transparent 70%);
      bottom: -200px;
      left: -200px;
      pointer-events: none;
    }
    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      position: relative;
      z-index: 1;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 8px 32px rgba(99,102,241,0.25);
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #e4e4e7, #a1a1aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p {
      color: #71717a;
      font-size: 14px;
      margin-top: 6px;
    }
    .card {
      background: #12121a;
      border: 1px solid #1e1e2a;
      border-radius: 16px;
      padding: 32px;
      backdrop-filter: blur(20px);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #a1a1aa;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: #1a1a26;
      border: 1px solid #27273a;
      border-radius: 10px;
      color: #e4e4e7;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s;
      outline: none;
    }
    .form-group input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }
    .form-group input::placeholder {
      color: #52525b;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .error.visible { display: block; }
    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #52525b;
    }
    .squad-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      margin-top: 8px;
    }
    .loading {
      display: none;
      text-align: center;
      padding: 8px;
    }
    .loading.visible { display: block; }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #27273a;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">V4</div>
      <h1>V4 Agents</h1>
      <p>Faça login para acessar os agentes de IA</p>
    </div>

    <div class="card">
      <div class="error" id="error"></div>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" placeholder="Seu usuário V4" required autocomplete="username" autofocus>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="Sua senha" required autocomplete="current-password">
        </div>
        <div class="loading" id="loading">
          <div class="spinner"></div>
        </div>
        <button type="submit" class="btn" id="submitBtn">Entrar</button>
      </form>
    </div>

    <div class="footer">
      V4 Company &mdash; Agents Hub
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const error = document.getElementById('error');
      const loading = document.getElementById('loading');
      const submitBtn = document.getElementById('submitBtn');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      error.classList.remove('visible');
      loading.classList.add('visible');
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Erro ao autenticar');
        }

        window.location.href = '/';
      } catch (err) {
        error.textContent = err.message;
        error.classList.add('visible');
      } finally {
        loading.classList.remove('visible');
        submitBtn.disabled = false;
      }

      return false;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const form = document.getElementById('loginForm');
        if (form) form.dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
