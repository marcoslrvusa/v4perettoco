<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060a17;--surface:rgba(12,20,40,.9);--border:rgba(0,180,255,.12);--cyan:#00b4ff;--amber:#ff6a00;--text:#dce3f0;--dim:rgba(220,227,240,.5);--muted:rgba(220,227,240,.25)}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;height:100vh;display:flex;align-items:center;justify-content:center}
.container{width:440px;height:780px;max-width:96vw;max-height:96vh;background:var(--surface);border:1px solid var(--border);border-radius:20px;backdrop-filter:blur(24px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 80px rgba(0,180,255,.06),inset 0 0 60px rgba(0,180,255,.02)}
.header{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo{width:36px;height:36px;border:1.5px solid var(--cyan);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:monospace;font-weight:700;font-size:15px;color:var(--cyan);position:relative}
.logo::after{content:'';position:absolute;top:-2px;right:-2px;width:7px;height:7px;background:var(--amber);border-radius:50%}
.hdr-t{font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,var(--cyan),var(--amber));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-s{font-size:11px;color:var(--dim);letter-spacing:.5px;margin-top:1px}
.messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:3px}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.msg{max-width:90%;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.55;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;background:rgba(0,180,255,.08);border:1px solid rgba(0,180,255,.18);border-bottom-right-radius:3px;color:#b8dcff}
.msg.bot{align-self:flex-start;background:rgba(255,106,0,.05);border:1px solid rgba(255,106,0,.1);border-bottom-left-radius:3px}
.msg-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;opacity:.45;margin-bottom:4px;font-weight:600}
.msg.bot .msg-label{color:var(--amber)}
.msg.user .msg-label{color:var(--cyan);text-align:right}
.typing{align-self:flex-start;display:flex;gap:5px;padding:12px 18px;background:rgba(255,106,0,.04);border:1px solid rgba(255,106,0,.08);border-radius:10px;border-bottom-left-radius:3px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:bounce 1.3s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.input-area{padding:14px 18px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.input-wrap{flex:1;display:flex;gap:8px}
.input-wrap input{flex:1;padding:11px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(0,180,255,.12);border-radius:10px;color:var(--text);font-size:13px;outline:none;transition:.2s}
.input-wrap input:focus{border-color:var(--cyan);box-shadow:0 0 16px rgba(0,180,255,.12)}
.input-wrap input::placeholder{color:var(--muted)}
.btn{width:40px;height:40px;border:1px solid var(--border);border-radius:10px;background:rgba(0,180,255,.06);color:var(--cyan);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;font-size:16px;flex-shrink:0}
.btn:hover{background:rgba(0,180,255,.14);border-color:var(--cyan)}
.btn:disabled{opacity:.25;cursor:not-allowed}
.btn.voice.active{background:rgba(255,106,0,.15);border-color:var(--amber);color:var(--amber);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(255,106,0,0)}50%{box-shadow:0 0 14px rgba(255,106,0,.25)}}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:30px 20px;gap:12px}
.welcome .icon{width:56px;height:56px;border:2px solid var(--cyan);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:monospace;font-weight:700;font-size:24px;color:var(--cyan)}
.welcome h2{font-size:16px;font-weight:400;color:var(--dim);letter-spacing:.5px}
.welcome p{font-size:12px;color:var(--muted);max-width:280px;line-height:1.5}
.sugs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.sug{padding:6px 12px;border:1px solid rgba(0,180,255,.12);border-radius:16px;font-size:11px;color:var(--dim);cursor:pointer;transition:.2s;background:transparent;font-family:inherit}
.sug:hover{border-color:var(--cyan);background:rgba(0,180,255,.08);color:var(--cyan)}
.status{font-size:10px;color:var(--muted);letter-spacing:.5px;margin-left:auto;display:flex;align-items:center;gap:5px}
.status-dot{width:5px;height:5px;border-radius:50%;background:#22c55e}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">J</div>
    <div>
      <div class="hdr-t">J.A.R.V.I.S.</div>
      <div class="hdr-s">Assistente Pessoal</div>
    </div>
    <div class="status"><span class="status-dot"></span>ONLINE</div>
  </div>
  <div class="messages" id="msgs">
    <div class="welcome" id="welcome">
      <div class="icon">J</div>
      <h2>Bem-vindo, Senhor.</h2>
      <p>J.A.R.V.I.S. à sua disposição. Fale ou digite o que precisa.</p>
      <div class="sugs">
        <button class="sug" onclick="q('Pesquise sobre IA em 2026')">Pesquisar IA</button>
        <button class="sug" onclick="q('Crie um post para LinkedIn')">Post LinkedIn</button>
        <button class="sug" onclick="q('Quais as últimas tendências tech?')">Tendências</button>
      </div>
    </div>
  </div>
  <div class="input-area">
    <button class="btn voice" id="voiceBtn" onclick="toggleVoice()" title="Falar">🎤</button>
    <div class="input-wrap">
      <input type="text" id="input" placeholder="Digite sua mensagem, Senhor..." autofocus onkeydown="if(event.key==='Enter')send()">
      <button class="btn" id="sendBtn" onclick="send()" disabled>➤</button>
    </div>
  </div>
</div>

<script>
const WEBHOOK = 'https://n8n-oja8.srv1666908.hstgr.cloud/webhook/jarvis';
const msgs = document.getElementById('msgs');
const welcome = document.getElementById('welcome');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const voiceBtn = document.getElementById('voiceBtn');
let busy = false;
let listening = false;
let recognition = null;

input.addEventListener('input',()=>{sendBtn.disabled=!input.value.trim()||busy});

function addMsg(text, role) {
  welcome.style.display = 'none';
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = `<div class="msg-label">${role==='user'?'Você':'J.A.R.V.I.S.'}</div><div>` + text.replace(/\n/g,'<br>') + '</div>';
  if (role==='bot') d.id = 'lastBot';
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function typing(on) {
  const t = document.getElementById('typing');
  if (on && !t) {
    const d = document.createElement('div');
    d.className = 'typing'; d.id = 'typing';
    d.innerHTML = '<span></span><span></span><span></span>';
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
  } else if (!on && t) t.remove();
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'pt-BR';
  u.rate = 1.0;
  u.pitch = 0.9;
  const voices = window.speechSynthesis.getVoices();
  const br = voices.find(v=>v.lang.startsWith('pt'));
  if (br) u.voice = br;
  window.speechSynthesis.speak(u);
}

function q(t) { input.value = t; input.dispatchEvent(new Event('input')); send(); }

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  addMsg(text, 'user');
  input.value = '';
  typing(true);
  try {
    const ac = new AbortController();
    setTimeout(() => ac.abort(), 45000);
    const r = await fetch(WEBHOOK, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({query: text}),
      signal: ac.signal
    });
    typing(false);
    const d = await r.json().catch(()=>({}));
    const resp = d.output || d.response || d.result || d.text || d.message || JSON.stringify(d);
    const clean = String(resp).replace(/^["'\s]+|["'\s]+$/g,'');
    addMsg(clean, 'bot');
    speak(clean);
  } catch(e) {
    typing(false);
    const err = e.name==='AbortError' ? 'A conexão excedeu o limite de tempo.' : 'Erro de conexão.';
    addMsg(err, 'bot');
  }
  busy = false; sendBtn.disabled = !input.value.trim();
}

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    addMsg('Seu navegador não suporta reconhecimento de voz. Use Chrome.', 'bot');
    return;
  }
  if (listening) {
    if (recognition) recognition.stop();
    voiceBtn.classList.remove('active');
    listening = false;
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'pt-BR';
  recognition.interimResults = true;
  recognition.continuous = false;
  recognition.onresult = (e) => {
    let t = '';
    for (let i = e.resultIndex; i < e.results.length; i++)
      t += e.results[i][0].transcript;
    input.value = t;
    input.dispatchEvent(new Event('input'));
  };
  recognition.onend = () => {
    voiceBtn.classList.remove('active');
    listening = false;
    const t = input.value.trim();
    if (t) send();
  };
  recognition.onerror = () => {
    voiceBtn.classList.remove('active');
    listening = false;
  };
  recognition.start();
  voiceBtn.classList.add('active');
  listening = true;
}
</script>
</body>
</html>
