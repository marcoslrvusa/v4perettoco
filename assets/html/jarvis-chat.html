<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. — Assistente Pessoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0e17;
  --surface: rgba(16, 24, 48, 0.85);
  --surface-border: rgba(0, 180, 255, 0.15);
  --primary: #00b4ff;
  --primary-dim: rgba(0, 180, 255, 0.1);
  --primary-glow: rgba(0, 180, 255, 0.3);
  --accent: #ff6a00;
  --accent-glow: rgba(255, 106, 0, 0.3);
  --text: #e8edf5;
  --text-dim: rgba(232, 237, 245, 0.5);
  --text-muted: rgba(232, 237, 245, 0.3);
  --user-msg: rgba(0, 180, 255, 0.12);
  --bot-msg: rgba(255, 106, 0, 0.06);
  --radius: 16px;
  --radius-sm: 10px;
}
body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(0, 180, 255, 0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(255, 106, 0, 0.02) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(0, 180, 255, 0.02) 0%, transparent 50%);
  z-index: 0;
}
.scanlines {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 180, 255, 0.015) 2px, rgba(0, 180, 255, 0.015) 4px);
  pointer-events: none;
  z-index: 1;
}
.container {
  position: relative;
  z-index: 2;
  width: 480px;
  height: 780px;
  max-width: 95vw;
  max-height: 95vh;
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius);
  backdrop-filter: blur(20px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(0, 180, 255, 0.08), inset 0 0 60px rgba(0, 180, 255, 0.03);
}
/* Header */
.header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--surface-border);
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  position: relative;
}
.header::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 10%;
  width: 80%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
  opacity: 0.5;
}
.logo {
  width: 40px;
  height: 40px;
  border: 2px solid var(--primary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
  animation: pulse-glow 3s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 10px var(--primary-glow); }
  50% { box-shadow: 0 0 25px var(--primary-glow), 0 0 50px var(--primary-glow); }
}
.logo::before {
  content: 'J';
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 18px;
  color: var(--primary);
  text-shadow: 0 0 10px var(--primary-glow);
}
.logo-dot {
  position: absolute;
  top: -2px; right: -2px;
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  animation: blink 2s step-end infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
.header-info { flex: 1; }
.header-title {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 3px;
  text-transform: uppercase;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-sub {
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 1px;
  margin-top: 2px;
}
.status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #22c55e;
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
/* Messages */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar {
  width: 4px;
}
.messages::-webkit-scrollbar-track {
  background: transparent;
}
.messages::-webkit-scrollbar-thumb {
  background: var(--primary-dim);
  border-radius: 4px;
}
.msg {
  max-width: 88%;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  line-height: 1.6;
  animation: msg-in 0.3s ease-out;
  position: relative;
}
@keyframes msg-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg.user {
  align-self: flex-end;
  background: var(--user-msg);
  border: 1px solid rgba(0, 180, 255, 0.2);
  border-bottom-right-radius: 4px;
  color: #c8e6ff;
}
.msg.bot {
  align-self: flex-start;
  background: var(--bot-msg);
  border: 1px solid rgba(255, 106, 0, 0.12);
  border-bottom-left-radius: 4px;
  color: var(--text);
}
.msg-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 6px;
  opacity: 0.5;
  font-weight: 500;
}
.msg.bot .msg-label {
  color: var(--accent);
}
.msg.user .msg-label {
  color: var(--primary);
  text-align: right;
}
.msg-content {
  word-wrap: break-word;
  white-space: pre-wrap;
}
.msg-content p { margin-bottom: 8px; }
.msg-content p:last-child { margin-bottom: 0; }
.typing {
  align-self: flex-start;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 14px 20px;
  background: var(--bot-msg);
  border: 1px solid rgba(255, 106, 0, 0.1);
  border-radius: var(--radius-sm);
  border-bottom-left-radius: 4px;
  animation: msg-in 0.2s ease-out;
}
.typing-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text-dim);
  animation: typing-bounce 1.4s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing-bounce {
  0%, 60%, 100% { transform: translateY(0); background: var(--text-dim); }
  30% { transform: translateY(-6px); background: var(--primary); }
}
/* Input */
.input-area {
  padding: 16px 20px 20px;
  border-top: 1px solid var(--surface-border);
  display: flex;
  gap: 10px;
  flex-shrink: 0;
  position: relative;
}
.input-area::before {
  content: '';
  position: absolute;
  top: -1px;
  left: 10%;
  width: 80%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
  opacity: 0.3;
}
.input-wrap {
  flex: 1;
  position: relative;
}
.input-wrap input {
  width: 100%;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(0, 180, 255, 0.15);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border 0.2s, box-shadow 0.2s;
}
.input-wrap input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 20px var(--primary-glow);
}
.input-wrap input::placeholder {
  color: var(--text-muted);
}
.btn-send {
  width: 44px; height: 44px;
  border: 1px solid var(--primary);
  border-radius: var(--radius-sm);
  background: var(--primary-dim);
  color: var(--primary);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.btn-send:hover {
  background: rgba(0, 180, 255, 0.2);
  box-shadow: 0 0 20px var(--primary-glow);
}
.btn-send:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
/* Welcome */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  text-align: center;
  padding: 40px 20px;
  gap: 16px;
}
.welcome-icon {
  width: 64px;
  height: 64px;
  border: 2px solid var(--primary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 28px;
  color: var(--primary);
  margin-bottom: 8px;
  animation: pulse-glow 3s ease-in-out infinite;
}
.welcome h2 {
  font-size: 18px;
  font-weight: 400;
  color: var(--text-dim);
  letter-spacing: 1px;
}
.welcome p {
  font-size: 13px;
  color: var(--text-muted);
  max-width: 300px;
  line-height: 1.6;
}
.welcome-suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 8px;
}
.suggestion {
  padding: 8px 14px;
  border: 1px solid rgba(0, 180, 255, 0.15);
  border-radius: 20px;
  font-size: 12px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
  background: transparent;
  font-family: 'Outfit', sans-serif;
}
.suggestion:hover {
  border-color: var(--primary);
  background: var(--primary-dim);
  color: var(--primary);
}
/* Error */
.error-banner {
  display: none;
  padding: 10px 16px;
  background: rgba(255, 0, 0, 0.1);
  border: 1px solid rgba(255, 0, 0, 0.2);
  margin: 0 16px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: #ff6b6b;
  text-align: center;
}
.error-banner.show {
  display: block;
  animation: msg-in 0.3s ease-out;
}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="container">
  <div class="header">
    <div class="logo"><span class="logo-dot"></span></div>
    <div class="header-info">
      <div class="header-title">J.A.R.V.I.S.</div>
      <div class="header-sub">Assistente Pessoal Inteligente</div>
    </div>
    <div class="status">
      <span class="status-dot"></span>
      ONLINE
    </div>
  </div>

  <div class="error-banner" id="errorBanner"></div>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">J</div>
      <h2>Bem-vindo, Senhor.</h2>
      <p>J.A.R.V.I.S. à sua disposição. Como posso ajudá-lo hoje?</p>
      <div class="welcome-suggestions">
        <button class="suggestion" onclick="sendSuggestion('Pesquise sobre inteligência artificial em 2026')">Pesquisar IA 2026</button>
        <button class="suggestion" onclick="sendSuggestion('Crie um post para LinkedIn sobre produtividade')">Post LinkedIn</button>
        <button class="suggestion" onclick="sendSuggestion('Quais as últimas tendências em tecnologia?')">Tendências Tech</button>
        <button class="suggestion" onclick="sendSuggestion('Me ajude a organizar minha semana')">Organizar Semana</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <input type="text" id="input" placeholder="Digite sua mensagem, Senhor..." autofocus
             onkeydown="if(event.key==='Enter') send()">
    </div>
    <button class="btn-send" id="sendBtn" onclick="send()" disabled>➤</button>
  </div>
</div>

<script>
const WEBHOOK_URL = 'https://n8n-oja8.srv1666908.hstgr.cloud/webhook/jarvis';
const messagesEl = document.getElementById('messages');
const welcomeEl = document.getElementById('welcome');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const errorBanner = document.getElementById('errorBanner');

let isProcessing = false;

inputEl.addEventListener('input', () => {
  sendBtn.disabled = !inputEl.value.trim() || isProcessing;
});

function showError(msg) {
  errorBanner.textContent = msg;
  errorBanner.classList.add('show');
  setTimeout(() => errorBanner.classList.remove('show'), 5000);
}

function addMessage(text, role) {
  welcomeEl.style.display = 'none';
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="msg-label">${role === 'user' ? 'Você' : 'J.A.R.V.I.S.'}</div>
    <div class="msg-content">${text.replace(/\n/g, '<br>')}</div>
  `;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing';
  div.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function sendSuggestion(text) {
  inputEl.value = text;
  inputEl.dispatchEvent(new Event('input'));
  send();
}

function formatResponse(text) {
  if (!text) return 'Sem resposta.';
  if (text.length > 5000) return text.slice(0, 5000) + '...';
  return text;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || isProcessing) return;

  isProcessing = true;
  sendBtn.disabled = true;
  addMessage(text, 'user');
  inputEl.value = '';
  showTyping();

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 45000);

    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: text }),
      signal: controller.signal
    });
    clearTimeout(timeout);
    hideTyping();

    if (!res.ok) {
      const errorText = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status}: ${errorText.slice(0, 100)}`);
    }

    const data = await res.json().catch(() => ({}));
    let response = data.output || data.response || data.result || data.text || data.message || JSON.stringify(data);
    if (typeof response === 'object' && response !== null) {
      response = JSON.stringify(response);
    }
    addMessage(formatResponse(response), 'bot');

  } catch (err) {
    hideTyping();
    if (err.name === 'AbortError') {
      showError('Tempo limite excedido. Tente novamente, Senhor.');
      addMessage('A conexão excedeu o tempo limite. Por favor, tente novamente.', 'bot');
    } else if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
      showError('Erro de conexão. Verifique se o n8n está online.');
      addMessage('Erro de conexão com o servidor. Senhor, verifique se o n8n está rodando.', 'bot');
    } else {
      showError(`Erro: ${err.message}`);
      addMessage(`Ocorreu um erro: ${err.message}`, 'bot');
    }
  }

  isProcessing = false;
  sendBtn.disabled = !inputEl.value.trim();
}
</script>
</body>
</html>
